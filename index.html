<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23160a07'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23d8b064' text-anchor='middle'%3EA%26amp;L%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Manrope:wght@400;500;600&family=Noto+Serif+Malayalam:wght@400;500;600&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/v2/hero-film-poster.jpg">
<link rel="stylesheet" href="css/site.css?v=20261018r1">

</head>
<body>

<!-- Ornaments drawn once, reused everywhere -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2a8"/><stop offset=".5" stop-color="#d8b064"/><stop offset="1" stop-color="#a87a2c"/></linearGradient>
    <radialGradient id="gFlame" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff6d6"/><stop offset=".45" stop-color="#ffc861"/><stop offset="1" stop-color="#e2672a" stop-opacity="0"/></radialGradient>
    <symbol id="lamp" viewBox="0 0 120 200">
      <g class="lamp-flames">
        <path class="flame f1" d="M60 6 C52 22 52 34 60 40 C68 34 68 22 60 6Z"/>
        <path class="flame f2" d="M24 70 C19 80 19 88 24 92 C29 88 29 80 24 70Z"/>
        <path class="flame f3" d="M96 70 C91 80 91 88 96 92 C101 88 101 80 96 70Z"/>
      </g>
      <g fill="url(#gGold)" stroke="#7a5418" stroke-width=".8">
        <path d="M54 40 H66 L64 52 H56Z"/>
        <path d="M14 92 C20 102 100 102 106 92 L100 100 C90 108 30 108 20 100Z"/>
        <path d="M57 52 H63 V96 H57Z"/>
        <path d="M44 104 H76 C76 112 44 112 44 104Z"/>
        <path d="M56 110 H64 V150 H56Z"/>
        <circle cx="60" cy="128" r="7"/>
        <path d="M40 152 H80 C82 160 38 160 40 152Z"/>
        <path d="M54 160 H66 L70 176 H50Z"/>
        <path d="M22 186 C30 174 90 174 98 186 L102 194 H18Z"/>
      </g>
    </symbol>
    <symbol id="lotusRule" viewBox="0 0 240 40">
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <path class="draw" pathLength="1" d="M2 20 H86"/>
        <path class="draw" pathLength="1" d="M154 20 H238"/>
        <path class="draw" pathLength="1" d="M120 4 C108 14 108 28 120 36 C132 28 132 14 120 4Z"/>
        <path class="draw" pathLength="1" d="M120 36 C108 34 98 26 94 14 C106 16 114 24 120 36Z"/>
        <path class="draw" pathLength="1" d="M120 36 C132 34 142 26 146 14 C134 16 126 24 120 36Z"/>
        <path class="draw" pathLength="1" d="M120 36 C104 38 92 34 86 26 C100 24 112 28 120 36Z"/>
        <path class="draw" pathLength="1" d="M120 36 C136 38 148 34 154 26 C140 24 128 28 120 36Z"/>
      </g>
      <circle cx="86" cy="20" r="2" fill="currentColor"/><circle cx="154" cy="20" r="2" fill="currentColor"/>
    </symbol>
    <symbol id="corner" viewBox="0 0 80 80">
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <path d="M4 76 V20 C4 10 10 4 20 4 H76"/>
        <path d="M12 76 V26 C12 18 18 12 26 12 H76"/>
        <path d="M20 40 C20 28 28 20 40 20 C34 26 32 32 32 40 C28 36 24 36 20 40Z" fill="currentColor" fill-opacity=".18"/>
        <circle cx="28" cy="28" r="2.4" fill="currentColor"/>
      </g>
    </symbol>
    <symbol id="feather" viewBox="0 0 60 120">
      <path d="M30 118 C30 80 30 50 30 10" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <path d="M30 12 C8 26 6 60 30 74 C54 60 52 26 30 12Z" fill="#3c5a33" stroke="currentColor" stroke-width="1"/>
      <ellipse cx="30" cy="42" rx="12" ry="17" fill="#c98a2b"/>
      <ellipse cx="30" cy="44" rx="7" ry="10" fill="#3c5a33"/>
      <circle cx="30" cy="45" r="4" fill="#1d2b55"/>
    </symbol>
  </defs>
</svg>

<div class="progress" aria-hidden="true"><i id="progressBar"></i></div>

<button class="lang" id="langToggle" type="button" aria-label="Switch language / ഭാഷ മാറ്റുക">
  <span class="lang-en">EN</span>
  <span class="lang-ml">മല</span>
</button>

<button class="auto" id="autoBtn" type="button" hidden>
  <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
  <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
  <span id="autoLabel"></span>
</button>

<!-- The gate: two mural doors -->
<div class="gate" id="gate">
  <div class="door door-l"><div class="door-mural"></div></div>
  <div class="door door-r"><div class="door-mural"></div></div>
  <div class="gate-glow"></div>
  <div class="gate-content">
    <svg class="gate-lamp" aria-hidden="true"><use href="#lamp"/></svg>
    <div class="gate-line" data-i18n="intro1"></div>
    <div class="gate-names"><span data-name="groom"></span><em>&amp;</em><span data-name="bride"></span></div>
    <div class="gate-tag" data-i18n="introTag"></div>
    <div class="gate-date">03 · 05 · 06 · XII · MMXXVI</div>
    <button class="btn-open" type="button" data-open data-i18n="open"></button>
  </div>
  <button class="skip" type="button" data-open data-i18n="skip"></button>
</div>

<main>

  <!-- 01 Hero: a tall portrait film that settles into a temple arch as you scroll -->
  <section class="hero" id="top" data-screen-label="01 Hero">
    <div class="hero-stage">
      <div class="hero-mural hero-mural-l" aria-hidden="true"></div>
      <div class="hero-mural hero-mural-r" aria-hidden="true"></div>
      <div class="hero-media">
        <video id="heroFilm" class="hero-video" muted autoplay loop playsinline preload="auto" poster="assets/v2/hero-film-poster.jpg" aria-hidden="true">
          <source src="assets/v2/hero-film.mp4" type="video/mp4">
        </video>
        <div class="hero-shade"></div>
      </div>
      <div class="hero-arch" aria-hidden="true"><svg class="arch-c l"><use href="#corner"/></svg><svg class="arch-c r"><use href="#corner"/></svg></div>
      <div class="hero-copy">
        <div class="hero-eyebrow" data-i18n="together"></div>
        <h1 class="hero-names">
          <span class="hn" data-name="groom"></span>
          <span class="amp">&amp;</span>
          <span class="hn" data-name="bride"></span>
        </h1>
        <div class="hero-dates">
          <div><b>03</b><span data-i18n="guruvayurShort"></span></div>
          <i></i>
          <div><b>05</b><span data-i18n="chavaraShort"></span></div>
          <i></i>
          <div><b>06</b><span data-i18n="varkalaShort"></span></div>
        </div>
        <div class="hero-year" data-i18n="decYear"></div>
      </div>
      <div class="cue" aria-hidden="true"><span data-i18n="scroll"></span><i></i></div>
    </div>
  </section>

  <!-- 02 Invitation verse -->
  <section class="verse paper" data-scrub data-screen-label="02 Invitation">
    <div class="mural-side l" aria-hidden="true"></div>
    <div class="mural-side r" aria-hidden="true"></div>
    <div class="wrap narrow">
      <svg class="rule" aria-hidden="true" data-draw><use href="#lotusRule"/></svg>
      <p class="verse-kicker" data-reveal data-i18n="together"></p>
      <p class="verse-text" data-reveal data-i18n="invite"></p>
      <div class="verse-names" data-reveal><span data-name="groom"></span> <em>&amp;</em> <span data-name="bride"></span></div>
      <svg class="rule" aria-hidden="true" data-draw><use href="#lotusRule"/></svg>
    </div>
  </section>

  <!-- 03 Countdown -->
  <section class="countdown night" data-screen-label="03 Countdown">
    <div class="wrap">
      <h2 class="eyebrow" data-reveal data-i18n="countdown"></h2>
      <div class="cd-frame" data-reveal>
        <svg class="fc tl"><use href="#corner"/></svg><svg class="fc tr"><use href="#corner"/></svg>
        <svg class="fc bl"><use href="#corner"/></svg><svg class="fc br"><use href="#corner"/></svg>
        <div class="cd-grid" id="countdown"></div>
      </div>
      <div class="until" data-reveal data-i18n="until"></div>
    </div>
  </section>

  <!-- 04 Our story -->
  <section class="story paper" data-scrub data-screen-label="04 Our Story">
    <div class="mural-side l" aria-hidden="true"></div>
    <div class="mural-side r" aria-hidden="true"></div>
    <div class="wrap">
      <div class="heading" data-reveal>
        <svg class="rule" aria-hidden="true" data-draw><use href="#lotusRule"/></svg>
        <h2 class="h2" data-i18n="storyTitle"></h2>
      </div>
      <figure class="story-item" data-scrub>
        <div class="arch-photo" data-reveal>
          <picture><source type="image/webp" srcset="assets/v2/bamboo-laugh-720.webp 720w, assets/v2/bamboo-laugh-1200.webp 900w" sizes="(min-width: 900px) 420px, 82vw"><img src="assets/v2/bamboo-laugh-720.jpg" alt="Achu laughing with Lekshmi under a bamboo roof" width="720" height="1222" loading="lazy" decoding="async"></picture>
        </div>
        <figcaption data-reveal><span class="num">I</span><span data-i18n="story1"></span></figcaption>
      </figure>
      <figure class="story-item alt" data-scrub>
        <div class="arch-photo" data-reveal>
          <picture><source type="image/webp" srcset="assets/v2/monochrome-720.webp 720w, assets/v2/monochrome-1200.webp 1200w" sizes="(min-width: 900px) 420px, 82vw"><img src="assets/v2/monochrome-720.jpg" alt="Black and white portrait of Achu and Lekshmi" width="720" height="960" loading="lazy" decoding="async"></picture>
        </div>
        <figcaption data-reveal><span class="num">II</span><span data-i18n="story2"></span></figcaption>
      </figure>
      <figure class="story-item" data-scrub>
        <div class="arch-photo" data-reveal>
          <picture><source type="image/webp" srcset="assets/v2/gym-mirror-720.webp 720w, assets/v2/gym-mirror-1200.webp 1200w" sizes="(min-width: 900px) 420px, 82vw"><img src="assets/v2/gym-mirror-720.jpg" alt="Lekshmi and Achu taking a mirror selfie at the gym" width="720" height="960" loading="lazy" decoding="async"></picture>
        </div>
        <figcaption data-reveal><span class="num">III</span><span data-i18n="story3"></span></figcaption>
      </figure>
    </div>
  </section>

  <!-- 05 Moments film -->
  <section class="film night" data-scrub data-screen-label="05 Moments">
    <svg class="feather f-l" aria-hidden="true"><use href="#feather"/></svg>
    <svg class="feather f-r" aria-hidden="true"><use href="#feather"/></svg>
    <div class="wrap">
      <div class="heading" data-reveal>
        <svg class="rule" aria-hidden="true" data-draw><use href="#lotusRule"/></svg>
        <h2 class="h2" data-i18n="moments"></h2>
      </div>
      <div class="film-frame" data-reveal>
        <svg class="fc tl"><use href="#corner"/></svg><svg class="fc tr"><use href="#corner"/></svg>
        <svg class="fc bl"><use href="#corner"/></svg><svg class="fc br"><use href="#corner"/></svg>
        <video id="momentsFilm" muted loop playsinline preload="none" poster="assets/v2/moments-film-poster.jpg" data-inview-play aria-label="A short film of Achu and Lekshmi's photos">
          <source src="assets/v2/moments-film.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </section>

  <!-- 06 The three chapters -->
  <section class="chapters paper" data-scrub data-screen-label="06 Celebrations">
    <div class="mural-side l" aria-hidden="true"></div>
    <div class="mural-side r" aria-hidden="true"></div>
    <div class="wrap">
      <div class="heading" data-reveal>
        <svg class="rule" aria-hidden="true" data-draw><use href="#lotusRule"/></svg>
        <h2 class="h2" data-i18n="eventsTitle"></h2>
      </div>
      <figure class="chapters-photo" data-scrub>
        <div class="arch-photo tall" data-reveal>
          <picture><source type="image/webp" srcset="assets/v2/kasavu-white-720.webp 720w, assets/v2/kasavu-white-1200.webp 900w" sizes="(min-width: 900px) 440px, 82vw"><img src="assets/v2/kasavu-white-720.jpg" alt="Achu in a kasavu mundu standing with Lekshmi" width="720" height="1222" loading="lazy" decoding="async"></picture>
        </div>
      </figure>
      <div id="events" class="events"></div>
    </div>
  </section>

  <!-- 07 The invitation letters, one from each family -->
  <section class="letters night" id="letters" data-scrub data-screen-label="07 Letters">
    <svg class="feather f-l" aria-hidden="true"><use href="#feather"/></svg>
    <svg class="feather f-r" aria-hidden="true"><use href="#feather"/></svg>
    <div class="wrap">
      <div class="heading" data-reveal>
        <svg class="rule" aria-hidden="true" data-draw><use href="#lotusRule"/></svg>
        <h2 class="h2" data-i18n="lettersTitle"></h2>
        <p class="letters-note" data-i18n="lettersNote"></p>
      </div>
      <div class="letter-grid" id="letterGrid">
        <article class="letter" data-side="groom" data-reveal>
          <a class="letter-thumb" href="assets/v2/letters/achu-lekshmi-letter-grooms-family.jpg" target="_blank" rel="noopener">
            <picture><source type="image/webp" srcset="assets/v2/letters/letter-grooms-thumb.webp"><img src="assets/v2/letters/letter-grooms-thumb.jpg" alt="Invitation letter from the groom's family, Pradeep C and Jisy S" width="520" height="1102" loading="lazy" decoding="async"></picture>
          </a>
          <div class="letter-side" data-i18n="letterGroom"></div>
          <div class="letter-from">Pradeep C &amp; Jisy S</div>
          <div class="letter-actions">
            <a class="btn-dir" href="assets/v2/letters/achu-lekshmi-letter-grooms-family.jpg" download="Achu-Lekshmi-Invitation-Grooms-Family.jpg" data-i18n="download"></a>
            <a class="btn-line" href="assets/v2/letters/achu-lekshmi-letter-grooms-family.jpg" target="_blank" rel="noopener" data-i18n="view"></a>
          </div>
        </article>
        <article class="letter" data-side="bride" data-reveal>
          <a class="letter-thumb" href="assets/v2/letters/achu-lekshmi-letter-brides-family.jpg" target="_blank" rel="noopener">
            <picture><source type="image/webp" srcset="assets/v2/letters/letter-brides-thumb.webp"><img src="assets/v2/letters/letter-brides-thumb.jpg" alt="Invitation letter from the bride's family, Rajesh Kumar K and Sathikumari S" width="520" height="875" loading="lazy" decoding="async"></picture>
          </a>
          <div class="letter-side" data-i18n="letterBride"></div>
          <div class="letter-from">Rajesh Kumar K &amp; Sathikumari S</div>
          <div class="letter-actions">
            <a class="btn-dir" href="assets/v2/letters/achu-lekshmi-letter-brides-family.jpg" download="Achu-Lekshmi-Invitation-Brides-Family.jpg" data-i18n="download"></a>
            <a class="btn-line" href="assets/v2/letters/achu-lekshmi-letter-brides-family.jpg" target="_blank" rel="noopener" data-i18n="view"></a>
          </div>
        </article>
      </div>
    </div>
  </section>

  <!-- 08 RSVP -->
  <section class="rsvp night" id="rsvp" data-screen-label="08 RSVP">
    <div class="wrap narrow">
      <div class="heading" data-reveal>
        <svg class="rule" aria-hidden="true" data-draw><use href="#lotusRule"/></svg>
        <h2 class="h2" data-i18n="rsvp"></h2>
      </div>
      <div class="rsvp-card" data-reveal>
        <form class="form" id="rsvpForm" novalidate>
          <div class="field">
            <label class="flabel" for="fName" data-i18n="name"></label>
            <input class="input" id="fName" name="name" autocomplete="name" maxlength="80" aria-describedby="errName">
            <div class="err" id="errName" role="alert" hidden></div>
          </div>
          <div class="field">
            <label class="flabel" for="fPhone" data-i18n="phone"></label>
            <input class="input" id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91" maxlength="20" aria-describedby="errPhone">
            <div class="err" id="errPhone" role="alert" hidden></div>
          </div>
          <div class="field field-attend">
            <div class="flabel" id="attendLabel" data-i18n="attending"></div>
            <div class="opts" id="attendOpts" role="group" aria-labelledby="attendLabel"></div>
          </div>
          <div class="guests-row" id="guestsRow">
            <div class="flabel" id="guestsLabel" data-i18n="guests"></div>
            <div class="stepper">
              <button class="step" type="button" id="guestsDec" aria-label="Fewer guests">−</button>
              <div class="gcount" id="guestsCount" aria-live="polite" aria-labelledby="guestsLabel">4</div>
              <button class="step" type="button" id="guestsInc" aria-label="More guests">+</button>
            </div>
          </div>
          <div class="field">
            <label class="flabel" for="fNote" data-i18n="note"></label>
            <textarea class="input textarea" id="fNote" name="note" rows="3" maxlength="500"></textarea>
          </div>
          <div class="hp" aria-hidden="true">
            <label for="fWebsite">Leave this empty</label>
            <input id="fWebsite" name="website" tabindex="-1" autocomplete="off">
          </div>
          <button class="btn-send" type="submit" id="sendBtn"></button>
          <div class="err err-send" id="sendErr" role="alert" hidden></div>
        </form>
        <div class="thanks" id="thanks" hidden>
          <svg class="thanks-lamp" aria-hidden="true"><use href="#lamp"/></svg>
          <div class="thanks-h" id="thanksHead"></div>
          <div class="thanks-s" id="thanksSummary"></div>
          <button class="btn-edit" type="button" id="editBtn" data-i18n="edit"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 09 Credits -->
  <footer class="credits night" data-screen-label="09 Credits">
    <div class="wrap narrow">
      <svg class="credits-lamp" aria-hidden="true"><use href="#lamp"/></svg>
      <div id="credits" class="credits-list"></div>
      <svg class="rule" aria-hidden="true" data-draw><use href="#lotusRule"/></svg>
      <div class="credits-names"><span data-name="groom"></span> <em>&amp;</em> <span data-name="bride"></span></div>
    </div>
  </footer>
</main>

<script src="js/config.js?v=20261018r1"></script>
<script src="js/i18n.js?v=20261018r1"></script>
<script src="js/site.js?v=20261018r1"></script>
</body>
</html>
