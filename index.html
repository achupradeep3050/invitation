<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achu &amp; Lekshmi · December 2026</title>
<meta name="description" content="Together with their families, Achu &amp; Lekshmi request the pleasure of your company · Guruvayur 3 · Chavara 5 · Varkala 6 December 2026">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c0806">
<link rel="canonical" href="https://achupradeep.online/invitation/">
<meta property="og:type" content="website">
<meta property="og:title" content="Achu &amp; Lekshmi · December 2026">
<meta property="og:description" content="A wedding in three chapters · Guruvayur · Chavara · Varkala. Will you join us?">
<meta property="og:url" content="https://achupradeep.online/invitation/">
<meta property="og:image" content="https://achupradeep.online/invitation/assets/portrait-garden.jpg">
<meta property="og:image:width" content="900">
<meta property="og:image:height" content="1200">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235e1414'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23d4a24a' text-anchor='middle'%3EA%26amp;L%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500;600&family=Noto+Serif+Malayalam:wght@400;500;600&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261001v3c">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="watercolor" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7" result="noise"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" result="disp"></feDisplacementMap>
    <feGaussianBlur in="disp" stdDeviation="1.1" result="blur"></feGaussianBlur>
    <feComponentTransfer in="blur" result="light"><feFuncR type="gamma" exponent="0.78"></feFuncR><feFuncG type="gamma" exponent="0.8"></feFuncG><feFuncB type="gamma" exponent="0.86"></feFuncB></feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="3" result="paper"></feTurbulence>
    <feDiffuseLighting in="paper" surfaceScale="0.8" lighting-color="#fffaf0" result="tex"><feDistantLight azimuth="60" elevation="70"></feDistantLight></feDiffuseLighting>
    <feBlend in="light" in2="tex" mode="multiply" result="b"></feBlend>
    <feComposite in="b" in2="SourceGraphic" operator="in"></feComposite>
  </filter>
  <filter id="oil" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.02" numOctaves="3" seed="4" result="noise"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="disp"></feDisplacementMap>
    <feMorphology in="disp" operator="dilate" radius="1.4" result="blob"></feMorphology>
    <feGaussianBlur in="blob" stdDeviation="0.5" result="soft"></feGaussianBlur>
    <feComposite in="soft" in2="SourceGraphic" operator="in"></feComposite>
  </filter>
</svg>

<div class="grain" id="grain" aria-hidden="true"></div>

<button class="lang" id="langToggle" type="button" aria-label="Switch language">
  <span class="lang-en">EN</span>
  <span class="lang-ml">മല</span>
</button>

<nav class="dots" id="dots" aria-label="Chapters"></nav>

<!-- Intro: the doors -->
<div class="intro" id="intro" data-stage="0">
  <div class="door door-l"><div class="trim"></div><div class="seam"></div></div>
  <div class="door door-r"><div class="trim"></div></div>
  <div class="bar bar-t"></div>
  <div class="bar bar-b"></div>
  <div class="intro-content">
    <div class="intro-line" data-i18n="intro1"></div>
    <div class="intro-names">
      <div class="eyebrow-gold" data-i18n="introTag"></div>
      <div class="intro-name first" data-name="groom"></div>
      <div class="intro-amp">&amp;</div>
      <div class="intro-name" data-name="bride"></div>
    </div>
    <div class="intro-cta">
      <div class="intro-date">03 · 05 · 06 DECEMBER 2026</div>
      <button class="btn-open" type="button" data-open data-i18n="open"></button>
    </div>
  </div>
  <button class="skip" type="button" data-open data-i18n="skip"></button>
</div>

<!-- The chapters: one full-screen card each, locking in one per swipe. The scroller snaps to the rail of markers
     (sticky cards can't be snap targets themselves), and each card settles back as the next one covers it. -->
<main class="scroller" id="scroller">
  <div class="rail" id="rail" aria-hidden="true"></div>

  <section class="chapter" data-nav="0" data-screen-label="01 Hero">
    <div class="card hero" data-card>
      <div class="eyebrow-gold" data-i18n="together"></div>
      <div class="lamp"><canvas id="lamp"></canvas></div>
      <div class="hero-names">
        <h1 class="visually-hidden"><span data-name="groom"></span> &amp; <span data-name="bride"></span></h1>
        <div class="hero-name" data-name="groom" aria-hidden="true"></div>
        <div class="hero-amp" aria-hidden="true">&amp;</div>
        <div class="hero-name" data-name="bride" aria-hidden="true"></div>
        <p class="hero-invite" data-i18n="invite"></p>
      </div>
      <div class="dates">
        <div><div class="d">03</div><div class="p" data-i18n="guruvayurShort"></div></div>
        <div class="sep"></div>
        <div><div class="d">05</div><div class="p" data-i18n="chavaraShort"></div></div>
        <div class="sep"></div>
        <div><div class="d">06</div><div class="p" data-i18n="varkalaShort"></div></div>
      </div>
      <div class="swipe-hint"><div data-i18n="swipe"></div><i></i></div>
    </div>
  </section>

  <section class="chapter" data-nav="1" data-screen-label="02 Countdown">
    <div class="card countdown" data-card>
      <div class="band16"></div>
      <div class="countdown-inner" data-reveal>
        <h2 class="eyebrow" data-i18n="countdown"></h2>
        <div class="cd-grid" id="countdown"></div>
        <div class="until" data-i18n="until"></div>
      </div>
    </div>
  </section>

  <section class="chapter" data-nav="2" data-screen-label="03 Posters">
    <div class="card story" data-card>
      <div class="heading" data-reveal>
        <div class="rule"></div>
        <h2 class="h2" data-i18n="us"></h2>
      </div>
      <div class="stack-wrap">
        <div class="stack" id="stack" role="button" tabindex="0" aria-roledescription="photo stack" aria-label="Our story — tap for the next poster"></div>
      </div>
      <div class="stack-foot">
        <div class="stack-dots" id="stackDots"></div>
        <div class="hint" data-i18n="tap"></div>
      </div>
    </div>
  </section>

  <div id="events" class="events"></div>

  <section class="chapter" data-nav="5" data-screen-label="06 Reception">
    <div class="card reception scrolly" data-card id="recCard"></div>
  </section>

  <section class="chapter" data-nav="6" data-screen-label="07 Moments">
    <div class="card moments" data-card>
      <div class="heading" data-reveal>
        <div class="rule"></div>
        <h2 class="h2" data-i18n="moments"></h2>
      </div>
      <div class="stage" id="carStage">
        <div class="carousel" id="carousel">
          <div class="tile" style="transform:rotateY(0deg) translateZ(230px)"><div class="photo"><img src="assets/moments/m1.jpg" alt="Achu and Lekshmi" draggable="false"></div></div>
          <div class="tile" style="transform:rotateY(60deg) translateZ(230px)"><div class="photo"><img src="assets/moments/m2.jpg" alt="Achu and Lekshmi" draggable="false"></div></div>
          <div class="tile" style="transform:rotateY(120deg) translateZ(230px)"><div class="photo"><img src="assets/moments/m3.jpg" alt="Achu and Lekshmi" draggable="false"></div></div>
          <div class="tile" style="transform:rotateY(180deg) translateZ(230px)"><div class="photo"><img src="assets/moments/m4.jpg" alt="Achu and Lekshmi" draggable="false"></div></div>
          <div class="tile" style="transform:rotateY(240deg) translateZ(230px)"><div class="photo"><img src="assets/moments/m5.jpg" alt="Achu and Lekshmi" draggable="false"></div></div>
          <div class="tile" style="transform:rotateY(300deg) translateZ(230px)"><div class="photo"><img src="assets/moments/m6.jpg" alt="Achu and Lekshmi" draggable="false"></div></div>
        </div>
      </div>
      <div class="drag" data-i18n="drag"></div>
    </div>
  </section>

  <section class="chapter" data-nav="7" data-screen-label="08 RSVP" id="rsvp">
    <div class="card rsvp scrolly" data-card>
      <div class="heading rsvp-head">
        <div class="rule"></div>
        <h2 class="h2" data-i18n="rsvp"></h2>
      </div>
      <div class="rsvp-card">
        <form class="form" id="rsvpForm" novalidate>
          <div class="field">
            <label class="flabel" for="fName" data-i18n="name"></label>
            <input class="input" id="fName" name="name" autocomplete="name" maxlength="80" aria-describedby="errName">
            <div class="err" id="errName" role="alert" hidden></div>
          </div>
          <div class="field">
            <label class="flabel" for="fPhone" data-i18n="phone"></label>
            <input class="input" id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91" maxlength="20" aria-describedby="errPhone">
            <div class="err" id="errPhone" role="alert" hidden></div>
          </div>
          <div class="field field-attend">
            <div class="flabel" id="attendLabel" data-i18n="attending"></div>
            <div class="opts" id="attendOpts" role="group" aria-labelledby="attendLabel"></div>
          </div>
          <div class="guests-row" id="guestsRow">
            <div class="flabel" id="guestsLabel" data-i18n="guests"></div>
            <div class="stepper">
              <button class="step" type="button" id="guestsDec" aria-label="Fewer guests">−</button>
              <div class="gcount" id="guestsCount" aria-live="polite" aria-labelledby="guestsLabel">4</div>
              <button class="step" type="button" id="guestsInc" aria-label="More guests">+</button>
            </div>
          </div>
          <div class="field">
            <label class="flabel" for="fNote" data-i18n="note"></label>
            <textarea class="input textarea" id="fNote" name="note" rows="2" maxlength="500"></textarea>
          </div>
          <div class="hp" aria-hidden="true">
            <label for="fWebsite">Leave this empty</label>
            <input id="fWebsite" name="website" tabindex="-1" autocomplete="off">
          </div>
          <button class="btn-send" type="submit" id="sendBtn"></button>
          <div class="err err-send" id="sendErr" role="alert" hidden></div>
        </form>
        <div class="thanks" id="thanks" hidden>
          <div class="thanks-h" id="thanksHead"></div>
          <div class="thanks-s" id="thanksSummary"></div>
          <button class="btn-edit" type="button" id="editBtn" data-i18n="edit"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="chapter" data-nav="8" data-screen-label="09 Credits">
    <div class="card credits" data-card>
      <div id="credits" class="credits-list"></div>
      <div class="credits-line"></div>
      <div class="credits-names"><span data-name="groom"></span> &amp; <span data-name="bride"></span></div>
    </div>
  </section>
</main>

<script src="js/config.js?v=20261001v3c"></script>
<script src="js/i18n.js?v=20261001v3c"></script>
<script src="js/app.js?v=20261001v3c"></script>
</body>
</html>
